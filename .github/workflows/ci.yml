name: CI

on:
  push:
    branches: [main, develop, "production/**"]
  pull_request:

permissions:
  contents: read

jobs:
  security-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-lock.txt
          pip install pip-audit
      - name: Python dependency audit
        run: |
          pip check
          pip-audit -r backend/requirements-lock.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend dependency audit
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Compile backend
        run: python -m compileall -q backend/app

  regression-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements-lock.txt
      - name: Run Windows regression suite
        run: python -m unittest discover -s tests -v
